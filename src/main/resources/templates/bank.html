
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Transaction Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 25px;
            color: #243247;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        h1, h2 { color: #17365d; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #00000012;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #1764a3;
        }
        input, select, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }
        input, select { width: 100%; }
        button {
            background: #1764a3;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }
        .forms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .table-wrap { overflow-x: auto; }
        .success { color: green; }
        .error { color: #b42318; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-row input { width: auto; }
    </style>
</head>
<body>
<div class="container">

    <h1>Bank Transaction Dashboard</h1>

    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <div class="stats">
        <div class="card">
            <h3>Total Bank Balance</h3>
            <div class="stat-value" th:text="${totalBalance}">0.00</div>
        </div>
        <div class="card">
            <h3>Successful Transactions</h3>
            <div class="stat-value" th:text="${successCount}">0</div>
        </div>
        <div class="card">
            <h3>Failed Transactions</h3>
            <div class="stat-value" th:text="${failedCount}">0</div>
        </div>
    </div>

    <div class="forms">

        <div class="card">
            <h2>Add Customer</h2>

            <form th:action="@{/customers}" th:object="${customer}"
                  method="post">

                <label>Name</label>
                <input type="text" th:field="*{name}" required>

                <label>Email</label>
                <input type="email" th:field="*{email}" required>

                <label>Account Number</label>
                <input type="text" th:field="*{accountNumber}"
                       pattern="[0-9]{6}" required>

                <label>Initial Balance</label>
                <input type="number" th:field="*{balance}"
                       min="0" step="0.01" required>

                <button type="submit">Add Customer</button>
            </form>
        </div>

        <div class="card">
            <h2>Transfer Money</h2>

            <form th:action="@{/transfer}"
                  th:object="${transferRequest}" method="post">

                <label>From Account</label>
                <select th:field="*{fromAccount}" required>
                    <option value="">Select sender</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.accountNumber}"
                            th:text="${c.name + ' - ' + c.accountNumber}">
                    </option>
                </select>

                <label>To Account</label>
                <select th:field="*{toAccount}" required>
                    <option value="">Select receiver</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.accountNumber}"
                            th:text="${c.name + ' - ' + c.accountNumber}">
                    </option>
                </select>

                <label>Amount (LKR)</label>
                <input type="number" th:field="*{amount}"
                       min="0.01" step="0.01" required>

                <label class="checkbox-row">
                    <input type="checkbox" th:field="*{simulateFailure}">
                    Simulate Failure (Rollback Test)
                </label>

                <button type="submit">Transfer Money</button>
            </form>
        </div>

    </div>

    <div class="card">
        <h2>Customers</h2>

        <form th:action="@{/}" method="get">
            <input type="text" name="search"
                   th:value="${search}"
                   placeholder="Search customer by name">
            <button type="submit">Search</button>
            <a th:href="@{/}">Clear</a>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Account Number</th>
                    <th>Balance (LKR)</th>
                    <th>History</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.accountNumber}"></td>
                    <td th:text="${c.balance}"></td>
                    <td>
                        <a th:href="@{/accounts/{account}/history(
                            account=${c.accountNumber})}">
                            View History
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>Recent Transactions</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount</th>
                    <th>Type</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${transactions}">
                    <td th:text="${t.transactionDate}"></td>
                    <td th:text="${t.fromAccount}"></td>
                    <td th:text="${t.toAccount}"></td>
                    <td th:text="${t.amount}"></td>
                    <td th:text="${t.type}"></td>
                    <td th:text="${t.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
